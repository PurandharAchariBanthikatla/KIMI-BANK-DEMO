server:
  port: 8080

spring:
  application:
    name: kimibank-core

  datasource:
    url: jdbc:postgresql://localhost:5432/kimibank
    username: postgres
    password: your_postgresql_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  sql:
    init:
      mode: never

kimibank:
  jwt:
    secret: "CHANGE_ME_32_BYTE_MIN_SECRET_KEY_FOR_DEV_ONLY"
    access-token-minutes: 15
    refresh-token-days: 30

otp:
  length: 6
  ttl-seconds: 300
  max-attempts: 5
  dev-mode: true

logging:
  level:
    com.kimibank: DEBUG
